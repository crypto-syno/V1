{% extends "layout.html" %}
{% block content %}

<style>
    /* ==========================================================
       TAKAEARN - ULTRA-MINIMAL FLAT LOGIN UI
       Palette:
       --c-dark    : #021024
       --c-navy    : #052659
       --c-steel   : #5483B3
       --c-soft    : #7DA0CA
       --c-ice     : #C1E8FF
    ========================================================== */
    .fade-in-up { 
        animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        opacity: 0; 
        transform: translateY(14px); 
    }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

    /* Gorgeous Underline Input Fields */
    .field-group {
        position: relative;
        margin-bottom: 24px;
    }

    .clean-border-input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1.5px solid #C1E8FF;
        border-radius: 0;
        padding: 12px 38px 10px 32px;
        font-size: 14.5px;
        font-weight: 600;
        color: #021024;
        outline: none;
        transition: all 0.25s ease;
    }

    .clean-border-input::placeholder {
        color: #7DA0CA;
        font-weight: 500;
        font-size: 13.5px;
    }

    /* Animated expanding underline accent on focus */
    .field-accent-line {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0%;
        height: 2.5px;
        background: linear-gradient(90deg, #052659, #5483B3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        transform: translateX(-50%);
        border-radius: 2px;
        pointer-events: none;
    }

    .clean-border-input:focus ~ .field-accent-line {
        width: 100%;
    }

    .clean-border-input:focus {
        background: linear-gradient(180deg, transparent 75%, rgba(193, 232, 255, 0.25) 100%);
    }

    .field-icon-left {
        position: absolute;
        left: 4px;
        top: 50%;
        transform: translateY(-50%);
        color: #7DA0CA;
        font-size: 14px;
        transition: color 0.25s ease;
    }

    .clean-border-input:focus ~ .field-icon-left {
        color: #052659;
    }

    /* Primary Action Button */
    .btn-login-submit {
        background: linear-gradient(135deg, #052659 0%, #5483B3 100%);
        color: #FFFFFF;
        width: 100%;
        padding: 15px;
        border-radius: 16px;
        font-weight: 800;
        font-size: 13.5px;
        letter-spacing: 0.4px;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 8px 22px -4px rgba(5, 38, 89, 0.35);
        border: none;
        cursor: pointer;
    }
    .btn-login-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px -4px rgba(5, 38, 89, 0.45);
    }
    .btn-login-submit:active { transform: scale(0.97); }

    /* Hide standard bottom nav on login page */
    .premium-bottom-nav { display: none !important; }
</style>

<div class="max-w-md mx-auto w-full pt-1 pb-12 px-2 fade-in-up">

    <!-- ===================================================
         1. TOP BAR: [Logo (LEFT)] — [একাউন্ট খুলুন (RIGHT)]
    =================================================== -->
    <div class="flex items-center justify-between pb-4 border-b border-[#C1E8FF]/70">
        
        <!-- LEFT: Logo & Brand Name -->
        <a href="/" class="flex items-center gap-2.5 group">
            <img src="https://i.ibb.co/Nd7D48N4/7526.jpg" alt="TakaEarn" class="h-10 w-10 rounded-2xl object-cover border-2 border-[#C1E8FF] shadow-sm group-hover:scale-105 transition-transform">
            <span class="text-base font-black text-[#021024] tracking-tight">Taka<span class="text-[#052659]">Earn</span></span>
        </a>

        <!-- RIGHT: একাউন্ট খুলুন -->
        <a href="/register" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-black uppercase tracking-wider text-[#052659] bg-[#C1E8FF] border border-[#7DA0CA]/40 hover:bg-[#052659] hover:text-white transition shadow-sm active:scale-95">
            <i class="fa-solid fa-user-plus text-[10px]"></i>
            <span>একাউন্ট খুলুন</span>
        </a>

    </div>

    <!-- ===================================================
         2. VIDEO GUIDE: কীভাবে কাজ করবেন? ভিডিও দেখুন
    =================================================== -->
    <div class="my-5">
        <a href="/tutorial" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/90 border border-[#C1E8FF] hover:border-[#5483B3] text-[11px] font-bold text-[#052659] shadow-sm transition group backdrop-blur-sm">
            <span class="w-5 h-5 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center text-[9px] group-hover:scale-110 transition flex-shrink-0">
                <i class="fa-solid fa-play"></i>
            </span>
            <span>কীভাবে কাজ করবেন? <span class="underline decoration-[#7DA0CA] underline-offset-2">ভিডিও দেখুন</span></span>
            <i class="fa-solid fa-arrow-right text-[8px] text-[#7DA0CA] group-hover:translate-x-0.5 transition"></i>
        </a>
    </div>

    <!-- ===================================================
         3. MINIMAL TITLE
    =================================================== -->
    <div class="mb-7">
        <h1 class="text-2xl sm:text-3xl font-black text-[#021024] tracking-tight leading-tight mb-1">
            লগইন
        </h1>
        <p class="text-xs font-semibold text-[#5483B3]">
            আপনার একাউন্টের তথ্য দিয়ে প্রবেশ করুন
        </p>
    </div>

    <!-- ===================================================
         4. GORGEOUS UNDERLINE FORM (ONLY BORDER-BOTTOM)
    =================================================== -->
    <form method="POST" action="/login" id="loginForm" onsubmit="return handleLoginSubmit()">

        <!-- Email Field -->
        <div class="field-group">
            <input type="email" name="email" required placeholder="ইমেইল (yourmail@gmail.com)" class="clean-border-input font-mono">
            <i class="fa-regular fa-envelope field-icon-left"></i>
            <div class="field-accent-line"></div>
        </div>

        <!-- Password Field -->
        <div class="field-group">
            <input type="password" name="password" id="passInput" required placeholder="পাসওয়ার্ড (Password)" class="clean-border-input font-mono tracking-wider">
            <i class="fa-solid fa-lock field-icon-left"></i>
            
            <!-- Eye Toggle Button -->
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-2 top-1/2 -translate-y-1/2 text-[#7DA0CA] hover:text-[#052659] transition p-1">
                <i id="eyeToggleIcon" class="fa-regular fa-eye-slash text-sm"></i>
            </button>
            <div class="field-accent-line"></div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between mt-1 mb-7 px-0.5">
            <label class="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" id="rememberMe" class="accent-[#052659] h-3.5 w-3.5 cursor-pointer rounded border-[#C1E8FF]">
                <span class="text-xs font-semibold text-[#5483B3] hover:text-[#021024] transition">মনে রাখুন</span>
            </label>
            <a href="https://t.me/takaearn_help" target="_blank" class="text-xs font-bold text-[#052659] hover:underline transition">
                পাসওয়ার্ড ভুলে গেছেন?
            </a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-login-submit">
            <span>লগইন করুন</span> <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>

    </form>

    <!-- ===================================================
         5. MINIMAL FOOTER
    =================================================== -->
    <div class="mt-8 pt-5 border-t border-[#C1E8FF]/60 text-center space-y-2.5">
        <p class="text-xs font-medium text-[#5483B3]">
            একাউন্ট তৈরি করা নেই? 
            <a href="/register" class="text-[#052659] font-black hover:underline ml-1">নতুন একাউন্ট খুলুন</a>
        </p>

        <p class="text-[11px] font-bold text-[#7DA0CA] flex items-center justify-center gap-1.5 pt-1">
            <i class="fa-brands fa-telegram text-sky-500 text-sm"></i>
            সরাসরি সহায়তা: <a href="https://t.me/takaearn_help" target="_blank" class="text-[#052659] font-black hover:underline">@takaearn_help</a>
        </p>
    </div>

</div>

<!-- Scripts -->
<script>
    // Toggle Password Visibility
    function togglePasswordVisibility() {
        const passField = document.getElementById('passInput');
        const eyeIcon = document.getElementById('eyeToggleIcon');

        if (passField.type === "password") {
            passField.type = "text";
            eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            eyeIcon.classList.add('text-[#052659]');
        } else {
            passField.type = "password";
            eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            eyeIcon.classList.remove('text-[#052659]');
        }
    }

    // Submit Loading State
    function handleLoginSubmit() {
        const form = document.getElementById('loginForm');
        if (form.checkValidity()) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-base"></i> <span class="ml-2">লগইন হচ্ছে...</span>';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            return true;
        }
        return false;
    }
</script>

{% endblock %}
