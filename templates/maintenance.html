<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      overflow: hidden;
      color: #ffffff;
      perspective: 1200px;
    }

    /* Ambient Liquid Mesh Canvas */
    .liquid-mesh {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 40% 40%, rgba(99, 102, 241, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 65% 55%, rgba(236, 72, 153, 0.3) 0%, transparent 40%),
        radial-gradient(circle at 50% 60%, rgba(14, 165, 233, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 30% 70%, rgba(168, 85, 247, 0.25) 0%, transparent 50%);
      filter: blur(80px);
      animation: rotateLiquid 24s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating Liquid Drops */
    .blob {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 
        inset 0 -8px 12px rgba(0, 0, 0, 0.2),
        inset 0 8px 16px rgba(255, 255, 255, 0.4),
        0 15px 35px rgba(0, 0, 0, 0.4);
      z-index: 1;
      pointer-events: none;
      animation: float 10s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 140px;
      height: 140px;
      top: 18%;
      left: 22%;
      animation-duration: 9s;
    }

    .blob-2 {
      width: 90px;
      height: 90px;
      bottom: 22%;
      right: 24%;
      animation-duration: 12s;
      animation-delay: -3s;
    }

    /* Liquid Glassmorphic Hub */
    .liquid-card {
      position: relative;
      z-index: 2;
      width: min(90vw, 560px);
      padding: 3.5rem 3rem;
      border-radius: 36px;
      background: radial-gradient(
        120% 120% at 20% 10%,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(255, 255, 255, 0.03) 60%,
        rgba(255, 255, 255, 0.01) 100%
      );
      backdrop-filter: blur(35px) saturate(190%);
      -webkit-backdrop-filter: blur(35px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -12px 24px rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Infographic Liquid Pulse */
    .infographic-indicator {
      width: 72px;
      height: 72px;
      margin-bottom: 2.5rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .infographic-indicator .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-right-color: #ec4899;
      animation: spin 6s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    .infographic-indicator .core {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #38bdf8 60%, #1e1b4b 100%);
      box-shadow: 
        0 0 24px #38bdf8,
        inset 0 2px 4px rgba(255, 255, 255, 0.8);
      animation: pulseCore 2.4s ease-in-out infinite;
    }

    /* Typography */
    h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 0.85rem;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
    }

    p {
      font-size: clamp(1rem, 2vw, 1.15rem);
      font-weight: 300;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }

    /* Animations */
    @keyframes rotateLiquid {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-25px) scale(1.04); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseCore {
      0%, 100% {
        transform: scale(0.9);
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
      }
      50% {
        transform: scale(1.15);
        box-shadow: 0 0 32px rgba(236, 72, 153, 0.8);
      }
    }
  </style>
</head>
<body>

  <div class="liquid-mesh"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main class="liquid-card">
    <div class="infographic-indicator">
      <div class="ring"></div>
      <div class="core"></div>
    </div>
    <h1>System Crashed,</h1>
    <p>Our Engineer Team Fixing it, w8</p>
  </main>

  <script>
    const card = document.querySelector('.liquid-card');
    
    window.addEventListener('mousemove', (e) => {
      const { innerWidth: width, innerHeight: height } = window;
      const x = (e.clientX - width / 2) / 35;
      const y = (e.clientY - height / 2) / 35;
      card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });
  </script>
</body>
</html>
