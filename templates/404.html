<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F4F9FD">
    <title>পেজটি পাওয়া যায়নি | TakaEarn</title>

    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/Nd7D48N4/7526.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================
           TAKAEARN - SEAMLESS FLAT NOT-FOUND UI (NO CARDS, NO NUMBERS)
           Palette: #021024 | #052659 | #5483B3 | #7DA0CA | #C1E8FF
        ========================================================== */
        body { 
            font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; 
            background-color: #F4F9FD; 
            color: #021024;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 50% 20%, rgba(193, 232, 255, 0.6) 0px, transparent 60%),
                radial-gradient(at 100% 100%, rgba(125, 160, 202, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .fade-in-up { 
            animation: fadeInUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            opacity: 0; transform: translateY(16px); 
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* Icon Glow Halo */
        .icon-aura {
            position: relative;
            width: 86px;
            height: 86px;
            margin: 0 auto 20px auto;
            border-radius: 28px;
            background: linear-gradient(135deg, #C1E8FF 0%, #FFFFFF 100%);
            border: 2px solid #C1E8FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #052659;
            box-shadow: 0 12px 30px rgba(5, 38, 89, 0.08);
        }
        .icon-aura::after {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 36px;
            background: radial-gradient(circle, rgba(193, 232, 255, 0.8) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            animation: pulseAura 3s infinite ease-in-out;
        }
        @keyframes pulseAura {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        /* Buttons */
        .btn-flat-gradient {
            background: linear-gradient(135deg, #052659 0%, #5483B3 100%);
            color: #FFFFFF; width: 100%; padding: 16px;
            border-radius: 18px; font-weight: 800; font-size: 14px; text-transform: uppercase;
            letter-spacing: 0.4px; transition: all 0.25s ease; 
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 10px 25px -5px rgba(5, 38, 89, 0.35);
            text-decoration: none;
        }
        .btn-flat-gradient:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -4px rgba(5, 38, 89, 0.45); color: #FFFFFF; }
        .btn-flat-gradient:active { transform: scale(0.97); }

        .btn-flat-soft {
            background: #FFFFFF; color: #052659; border: 1.5px solid #C1E8FF; width: 100%; padding: 15px;
            border-radius: 18px; font-weight: 800; font-size: 13.5px; text-transform: uppercase;
            letter-spacing: 0.4px; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 15px -3px rgba(5, 38, 89, 0.03);
        }
        .btn-flat-soft:hover { background: #C1E8FF; border-color: #7DA0CA; color: #021024; }
        .btn-flat-soft:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <!-- Seamless Flat Container (No Hard Card Box) -->
    <div class="max-w-sm w-full text-center fade-in-up">
        
        <!-- Animated Icon with Soft Aura -->
        <div class="icon-aura">
            <i class="fa-solid fa-compass-drafting"></i>
        </div>
        
        <!-- Status Pill -->
        <div class="inline-flex items-center gap-1.5 bg-[#C1E8FF] text-[#052659] px-3.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wider mb-3 border border-[#7DA0CA]/30">
            <span class="w-1.5 h-1.5 rounded-full bg-[#052659] animate-ping"></span>
            <span>সংযোগ বিচ্ছিন্ন • পেজ অনুপস্থিত</span>
        </div>

        <h1 class="text-2xl sm:text-3xl font-black text-[#021024] tracking-tight mb-2">
            পেজটি খুঁজে পাওয়া যায়নি!
        </h1>
        
        <p class="text-xs sm:text-[13px] text-[#5483B3] font-semibold leading-relaxed mb-8 max-w-xs mx-auto">
            আপনি যে লিংকটিতে প্রবেশ করতে চেয়েছেন সেটি পরিবর্তিত হয়েছে অথবা মুছে ফেলা হয়েছে। অনুগ্রহ করে হোমপেজে ফিরে যান।
        </p>
        
        <!-- Flat Action Buttons -->
        <div class="flex flex-col gap-3">
            <a href="/" class="btn-flat-gradient">
                <i class="fa-solid fa-house text-xs"></i> <span>হোমপেজে ফিরে যান</span>
            </a>
            <a href="javascript:history.back()" class="btn-flat-soft">
                <i class="fa-solid fa-arrow-left text-xs"></i> <span>পূর্বের পেজে যান</span>
            </a>
        </div>

        <!-- Footer Brand -->
        <div class="mt-10 pt-4 border-t border-[#C1E8FF]/60 text-center">
            <p class="text-[10px] font-bold text-[#7DA0CA] uppercase tracking-wider flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-shield-halved text-[#052659]"></i> TakaEarn Platform Navigation
            </p>
        </div>

    </div>

</body>
</html>
